name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

        Every entry of this package is imported by path. Mentioning the exact path (and the version you have installed) is what makes a report actionable.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      description: Which entry are you importing? Pick the closest one.
      options:
        - chore/myBanner
        - chore/judgeProcessEnv
        - terser/4.x/production
        - terserWebpackPlugin/2.x/production
        - terserWebpackPlugin/2.x/working
        - imageWebpackLoader/6.x/production
        - imageWebpackLoader/8.x/production
        - browsersync/2.x/middleware/makeAjax
        - semanticRelease/15.x/makeConfig
        - semanticRelease/15.x/makeCommonConfig
        - semanticRelease/19.x/makeConfigWithPgkRootForLibrary
        - Build, packaging or CI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of @cycjimmy/config-lib you have installed.
      placeholder: 4.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js and package manager versions, plus the bundler or tool that consumes the configuration.
      placeholder: |
        Node.js: 24
        npm: 11
        Bundler: vite 8 / webpack 5 / none
        OS: macOS 15
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem.
      placeholder: |
        1. Import '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error message if there is one.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the relevant part of the build or runtime output. It is rendered as code, so no backticks are needed.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
