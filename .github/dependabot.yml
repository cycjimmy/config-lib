version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    labels:
      - dependencies
    open-pull-requests-limit: 10
    # typescript and vite are left ungrouped on purpose: their majors change the
    # build output and need to be reviewed on their own instead of riding along
    # with an unrelated bump.
    groups:
      lint:
        patterns:
          - eslint
          - '@antfu/*'
          - jiti
      test:
        patterns:
          - vitest
          - '@vitest/*'
      build:
        patterns:
          - trash-cli
          - fs-extra
          - '@types/*'
